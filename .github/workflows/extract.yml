name: Extract GlobQuantu

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q GlobQuantu.zip -d /tmp/globquantu
          if [ -d /tmp/globquantu/GlobQuantu ]; then
            rsync -a --exclude='.git/' /tmp/globquantu/GlobQuantu/ ./
          else
            rsync -a --exclude='.git/' /tmp/globquantu/ ./
          fi
          rm -f GlobQuantu.zip

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract GlobQuantu project" || echo "No changes to commit"
          git push
